# Local HTTPS ingress overlay for compose.production.yml.
#
#   docker compose -f compose.production.yml -f compose.local-tls.yml --env-file test.env up -d
#
# The production stack is origin-locked and refuses any non-HTTPS canonical origin, so the web
# containers cannot be exercised over http://localhost:PORT -- assertSameOrigin() rejects the
# browser's Origin before any credential is checked and both admin login and the client gate
# return 401. This overlay puts Caddy in front on the canonical hostnames with a locally issued
# certificate, which is the same shape as the production ingress.
services:
  caddy:
    image: caddy:2-alpine
    environment:
      BOOK_HOST: ${BOOK_HOST:?set the local booking hostname, e.g. book.localhost}
      ADMIN_HOST: ${ADMIN_HOST:?set the local admin hostname, e.g. admin.localhost}
    # compose exposes secrets as files only, but the Caddyfile needs the shared secret as an
    # env placeholder. Read it in, then exec caddy so it stays PID 1 and still receives signals.
    command: ["sh","-c","export PROXY_SHARED_SECRET=\"$$(cat /run/secrets/proxy_shared_secret)\"; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    secrets: [proxy_shared_secret]
    volumes:
      - ./infrastructure/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      # Persists the local CA between restarts, so the root you trusted once stays valid.
      - caddy_local_data:/data
    ports: ["80:80", "443:443"]
    depends_on:
      web-book: { condition: service_healthy }
      web-admin: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Dropping ALL also drops the ability of root to bind 80 and 443 inside the container.
    cap_add: [NET_BIND_SERVICE]
    deploy: { resources: { limits: { cpus: "1", memory: 256M } } }
  # Bound to loopback only, and solely so the one-off operator steps (db:provision:postgres-logins
  # and db:bootstrap-admin) can reach the database from the host. Production never publishes this.
  postgres: { ports: ["127.0.0.1:5432:5432"] }
  # Direct container ports, kept for health probes and `docker compose` debugging only.
  # Requests sent straight to these ports carry an Origin the app does not accept and will 401;
  # drive the app through https://$BOOK_HOST and https://$ADMIN_HOST instead.
  web-book: { ports: ["3100:3000"] }
  web-admin: { ports: ["3200:3000"] }
volumes:
  caddy_local_data: {}
