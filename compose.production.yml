name: snagtime-production
# Docker's default json-file driver grows without bound. The worker logs a tick every few seconds, so
# an unrotated host fills its disk and takes PostgreSQL down with it. Every service opts in below.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }
services:
  postgres:
    build: { context: ., dockerfile: infrastructure/postgresql/Dockerfile }
    environment:
      POSTGRES_USER: tempocove_owner
      POSTGRES_DB: tempocove
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets: [postgres_owner_password,postgres_server_cert,postgres_server_key,postgres_ca_cert]
    volumes: [postgres_data:/var/lib/postgresql/18/docker]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tempocove_owner -d tempocove"], interval: 10s, timeout: 5s, retries: 12 }
    logging: *logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy: { resources: { limits: { cpus: "2", memory: 1G } } }
  migration:
    build: { context: ., target: migration }
    profiles: [migration]
    environment: &production_env
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      NEXT_PUBLIC_APP_URL: ${BOOK_APP_URL:?set canonical HTTPS booking origin}
    secrets: [migration_database_url,postgres_ca_cert]
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  # The booking and admin origins are the same image with different SURFACE values. SURFACE must never
  # be unset in production: unset means single-origin mode, which would serve the dashboard on the
  # public booking host with no error. The production contract rejects anything but "book" or "admin".
  web-book:
    <<: &web_common
      build: { context: ., target: runtime, args: { BUILD_ID: "${BOOK_BUILD_ID:?set immutable booking build identity}", NEXT_PUBLIC_APP_URL: "${BOOK_APP_URL:?set canonical HTTPS booking origin}" } }
      command: ["node","apps/web/server.js"]
      secrets: [app_database_url,postgres_ca_cert,auth_secret,booking_capability_secret,booking_capability_keyring,token_encryption_key,email_token_secret,tenant_context_secret,rate_limit_hash_secret,proxy_shared_secret,operator_health_secret,client_gate_password_hash,client_gate_secret,google_client_secret,smtp_password]
      depends_on: { postgres: { condition: service_healthy } }
      read_only: true
      tmpfs: [/tmp]
      security_opt: [no-new-privileges:true]
      cap_drop: [ALL]
      restart: unless-stopped
      expose: ["3000"]
      healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 4s, retries: 6 }
      logging: *logging
      deploy: { resources: { limits: { cpus: "1", memory: 512M } } }
    environment: &app_env
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL_FILE: /run/secrets/app_database_url
      DATABASE_ROLE: app
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      BOOKING_CAPABILITY_KEY_ID: ${BOOKING_CAPABILITY_KEY_ID:?set booking capability key id}
      BOOKING_CAPABILITY_SECRET_FILE: /run/secrets/booking_capability_secret
      BOOKING_CAPABILITY_KEYRING_FILE: /run/secrets/booking_capability_keyring
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      EMAIL_TOKEN_SECRET_FILE: /run/secrets/email_token_secret
      TENANT_CONTEXT_SECRET_FILE: /run/secrets/tenant_context_secret
      RATE_LIMIT_HASH_SECRET_FILE: /run/secrets/rate_limit_hash_secret
      PROXY_SHARED_SECRET_FILE: /run/secrets/proxy_shared_secret
      OPERATOR_HEALTH_SECRET_FILE: /run/secrets/operator_health_secret
      CLIENT_GATE_PASSWORD_HASH_FILE: /run/secrets/client_gate_password_hash
      CLIENT_GATE_SECRET_FILE: /run/secrets/client_gate_secret
      CLIENT_GATE_PASSWORD_VERSION: ${CLIENT_GATE_PASSWORD_VERSION:-1}
      SURFACE: book
      NEXT_PUBLIC_APP_URL: ${BOOK_APP_URL:?set canonical HTTPS booking origin}
      BUILD_ID: ${BOOK_BUILD_ID:?set immutable booking build identity}
      RATE_LIMIT_PROVIDER: postgresql
      RATE_LIMIT_MAX_BUCKETS: "100000"
      OUTBOX_WORKER_MODE: dedicated
      OUTBOX_WORKER_ENABLED: "false"
      TRUST_PROXY: "true"
      DEMO_MODE: "false"
      EMAIL_PROVIDER: smtp
      CALENDAR_PROVIDER: google
      PAYMENTS_PROVIDER: stub
      BOOKING_REMINDER_LEAD_HOURS: ${BOOKING_REMINDER_LEAD_HOURS:-24}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set Google client id}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      SMTP_HOST: ${SMTP_HOST:?set SMTP host}
      SMTP_PORT: ${SMTP_PORT:?set SMTP port}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:?set implicit or starttls}
      SMTP_USER: ${SMTP_USER:?set SMTP user}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      EMAIL_FROM: ${EMAIL_FROM:?set sender}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?set system reply address}
      EMAIL_SENDER_DOMAIN: ${EMAIL_SENDER_DOMAIN:?set authorized sender domain}
      # Optional. Where the studio's own booking notices go; unset means the barber's account address.
      # Needed on both surfaces: the app writes the recipient at enqueue, the worker re-checks it.
      ORGANIZER_NOTIFICATION_EMAIL: ${ORGANIZER_NOTIFICATION_EMAIL:-}
  web-admin:
    <<: *web_common
    build: { context: ., target: runtime, args: { BUILD_ID: "${ADMIN_BUILD_ID:?set immutable admin build identity}", NEXT_PUBLIC_APP_URL: "${ADMIN_APP_URL:?set canonical HTTPS admin origin}" } }
    environment:
      <<: *app_env
      SURFACE: admin
      NEXT_PUBLIC_APP_URL: ${ADMIN_APP_URL:?set canonical HTTPS admin origin}
      BUILD_ID: ${ADMIN_BUILD_ID:?set immutable admin build identity}
  # Ingress is part of the deployment, not something bolted on afterwards: the rate limiter is only
  # meaningful when a trusted proxy injects x-tempocove-proxy-secret and rewrites x-forwarded-for, and
  # nothing else in this file terminates TLS. An operator fronting the stack with their own proxy can
  # disable this one with `--scale caddy=0`, but must reproduce both header_up lines in Caddyfile.
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      BOOK_HOST: ${BOOK_HOST:?set the public booking hostname, e.g. book.your-domain.example}
      ADMIN_HOST: ${ADMIN_HOST:?set the public admin hostname, e.g. admin.your-domain.example}
      ACME_EMAIL: ${ACME_EMAIL:?set the ACME contact address for certificate notices}
    # compose exposes secrets as files only, but the Caddyfile needs the shared secret as an env
    # placeholder. Read it in, then exec caddy so it stays PID 1 and still receives signals.
    command: ["sh","-c","export PROXY_SHARED_SECRET=\"$$(cat /run/secrets/proxy_shared_secret)\"; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    secrets: [proxy_shared_secret]
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and the ACME account key. Losing this volume means re-issuing on restart,
      # which burns Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    ports: ["80:80", "443:443"]
    depends_on:
      web-book: { condition: service_healthy }
      web-admin: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Dropping ALL also drops root's ability to bind 80 and 443 inside the container.
    cap_add: [NET_BIND_SERVICE]
    logging: *logging
    deploy: { resources: { limits: { cpus: "1", memory: 256M } } }
  worker:
    build: { context: ., target: runtime, args: { BUILD_ID: "${BOOK_BUILD_ID:?set immutable booking build identity}", NEXT_PUBLIC_APP_URL: "${BOOK_APP_URL:?set canonical HTTPS booking origin}" } }
    command: ["node","dist/worker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_ROLE: worker
      WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      EMAIL_TOKEN_SECRET_FILE: /run/secrets/email_token_secret
      # Client-facing links in reminder and confirmation emails must point at the booking origin.
      NEXT_PUBLIC_APP_URL: ${BOOK_APP_URL:?set canonical HTTPS booking origin}
      OUTBOX_WORKER_MODE: dedicated
      OUTBOX_WORKER_ENABLED: "false"
      DEMO_MODE: "false"
      EMAIL_PROVIDER: smtp
      CALENDAR_PROVIDER: google
      PAYMENTS_PROVIDER: stub
      BOOKING_REMINDER_LEAD_HOURS: ${BOOKING_REMINDER_LEAD_HOURS:-24}
      BUILD_ID: ${BOOK_BUILD_ID:?set immutable booking build identity}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set Google client id}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      SMTP_HOST: ${SMTP_HOST:?set SMTP host}
      SMTP_PORT: ${SMTP_PORT:?set SMTP port}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:?set implicit or starttls}
      SMTP_USER: ${SMTP_USER:?set SMTP user}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      EMAIL_FROM: ${EMAIL_FROM:?set sender}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?set system reply address}
      EMAIL_SENDER_DOMAIN: ${EMAIL_SENDER_DOMAIN:?set authorized sender domain}
      # Optional. Where the studio's own booking notices go; unset means the barber's account address.
      # Needed on both surfaces: the app writes the recipient at enqueue, the worker re-checks it.
      ORGANIZER_NOTIFICATION_EMAIL: ${ORGANIZER_NOTIFICATION_EMAIL:-}
    secrets: [worker_database_url,postgres_ca_cert,token_encryption_key,email_token_secret,google_client_secret,smtp_password]
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    # A wedged-but-alive worker is the failure restart:unless-stopped cannot see. The loop touches
    # /tmp/worker-alive after every settled tick, so a stale file means the poll stopped advancing.
    # Compose does not restart on unhealthy by itself -- this makes the state visible to `docker ps`
    # and to whatever supervises the host; the web containers already go unready off the same stall.
    healthcheck:
      test: ["CMD", "node", "-e", "const{statSync}=require('node:fs');const max=Math.max(15000,Number(process.env.OUTBOX_POLL_INTERVAL_MS||5000)*3);process.exit(Date.now()-statSync('/tmp/worker-alive').mtimeMs<max?0:1)"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 30s
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }
# File-backed secrets for a single-VPS `docker compose` deployment. Swarm-style external secrets
# are not supported by plain compose, which refuses to start with "unsupported external secret".
# Create ./secrets/ (mode 700) on the host with one file per entry; it is gitignored.
secrets:
  postgres_owner_password: { file: ./secrets/postgres_owner_password }
  migration_database_url: { file: ./secrets/migration_database_url }
  app_database_url: { file: ./secrets/app_database_url }
  worker_database_url: { file: ./secrets/worker_database_url }
  monitor_database_url: { file: ./secrets/monitor_database_url }
  auth_secret: { file: ./secrets/auth_secret }
  booking_capability_secret: { file: ./secrets/booking_capability_secret }
  booking_capability_keyring: { file: ./secrets/booking_capability_keyring }
  token_encryption_key: { file: ./secrets/token_encryption_key }
  email_token_secret: { file: ./secrets/email_token_secret }
  tenant_context_secret: { file: ./secrets/tenant_context_secret }
  rate_limit_hash_secret: { file: ./secrets/rate_limit_hash_secret }
  proxy_shared_secret: { file: ./secrets/proxy_shared_secret }
  operator_health_secret: { file: ./secrets/operator_health_secret }
  client_gate_password_hash: { file: ./secrets/client_gate_password_hash }
  client_gate_secret: { file: ./secrets/client_gate_secret }
  google_client_secret: { file: ./secrets/google_client_secret }
  smtp_password: { file: ./secrets/smtp_password }
  postgres_server_cert: { file: ./secrets/postgres_server_cert }
  postgres_server_key: { file: ./secrets/postgres_server_key }
  postgres_ca_cert: { file: ./secrets/postgres_ca_cert }
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
